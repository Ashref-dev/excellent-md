services:
  # Optional metadata persistence (disabled by default).
  # Enable with: docker compose --profile persistence up --build
  # and set DATABASE_URL on the app service.
  db:
    profiles: ["persistence"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-excellent_md}
      POSTGRES_USER: ${POSTGRES_USER:-excel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-excel}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-excel} -d ${POSTGRES_DB:-excellent_md}"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL:-}

volumes:
  db-data:
